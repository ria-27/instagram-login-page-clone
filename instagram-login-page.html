<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="instagram-login-page.css">
        <title>instagram-login-page</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="main">
        <div class="screen">
            <img class="image" src="insta.png">
        <form class="content">
        <img class="title" src="Screenshot 2025-12-28 173948.png">
        <input class="username" type="text" placeholder="Phone number, username, or email">
        <input class="password" type="password" placeholder="Password">     
        <button class="login-button">Log in</button>
        <div class="divider">OR</div>
        <div class="fb">
        <img class="facebook-logo" src="facebook-logo.png">
        <button class="facebook">Log in with Facebook</button>
        </div>
        <a class="underline" href="https://www.instagram.com/accounts/password/reset/" target="_blank">
            <p class="forgot-password">Forgot password?</p>
        </a>
        <div class="no-acc">
            Don't have an account? 
            <a class="underline" href="https://www.instagram.com/accounts/emailsignup/">
            <span class="sign-up">Sign up</span>
            </a>
        </div>
        </form>
        </div>
        </div>
        <div class="links">
            <a class="last-link" href="https://www.meta.com/en-gb/about/?utm_source=about.meta.com&utm_medium=redirect" target="_blank">Meta</a>
            <a class="last-link" href="https://about.instagram.com/" target="_blank">About</a>
            <a class="last-link" href="https://about.instagram.com/blog/" target="_blank">Blog</a>
            <a class="last-link" href="https://about.instagram.com/about-us/careers" target="_blank">Jobs</a>
            <a class="last-link" href="https://help.instagram.com/" target="_blank">Help</a>
            <a class="last-link" href="https://developers.facebook.com/docs/instagram-platform" target="_blank">API</a>
            <a class="last-link" href="https://privacycenter.instagram.com/policy/?entry_point=ig_help_center_data_policy_redirect" target="_blank">Privacy</a>
            <a class="last-link" href="https://help.instagram.com/581066165581870/" target="_blank">Terms</a>
            <a class="last-link" href="https://www.instagram.com/explore/locations/" target="_blank">Location</a>
            <a class="last-link" href="https://www.instagram.com/web/lite/" target="_blank">Instagram Lite</a>
            <a class="last-link" href="https://www.meta.ai/?utm_source=foa_web_footer" target="_blank">Meta AI</a>
            <a class="last-link" href="https://www.threads.com/" target="_blank">Threads</a>
        </div>
        <div class="extra-footer">
                <select class="language">
                    <option selected>English</option>
                    <option>Hindi</option>
                    <option>Spanish</option>
                </select>
            <p class="copyright">© 2025 Instagram from Meta</p>
        </div>
    </body>
</html>
